server.port=18080
spring.application.name=a2a-secure-server

# DashScope 配置 (请替换为你的 API Key)
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:your-api-key-here}

# A2A 服务端配置
spring.ai.alibaba.a2a.server.enabled=true
spring.ai.alibaba.a2a.security.enabled=true

# Nacos 配置 (请根据你的环境修改)
spring.ai.alibaba.a2a.nacos.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.ai.alibaba.a2a.nacos.namespace=${NACOS_NAMESPACE:public}
spring.ai.alibaba.a2a.nacos.username=${NACOS_USERNAME:nacos}
spring.ai.alibaba.a2a.nacos.password=${NACOS_PASSWORD:nacos}

# OAuth2 Resource Server - 使用授权服务器验证 JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

