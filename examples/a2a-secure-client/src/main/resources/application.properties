server.port=18081
spring.application.name=a2a-secure-client

# Nacos 配置 (用于发现远程 Agent，请根据你的环境修改)
spring.ai.alibaba.a2a.nacos.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.ai.alibaba.a2a.nacos.namespace=${NACOS_NAMESPACE:public}
spring.ai.alibaba.a2a.nacos.username=${NACOS_USERNAME:nacos}
spring.ai.alibaba.a2a.nacos.password=${NACOS_PASSWORD:nacos}

# 启用 Nacos 发现功能
spring.ai.alibaba.a2a.nacos.discovery.enabled=true

# OAuth2 Client 配置 - 使用 client_credentials 获取 Token
spring.security.oauth2.client.registration.a2a.client-id=a2a-client
spring.security.oauth2.client.registration.a2a.client-secret=a2a-secret
spring.security.oauth2.client.registration.a2a.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.a2a.scope=agent.call
spring.security.oauth2.client.provider.a2a.token-uri=http://localhost:9000/oauth2/token

